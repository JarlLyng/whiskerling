name: Whiskerling
options:
  bundleIdPrefix: com.iamjarl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The String Catalog holds the translations; the project has to know the regions so a
  # da.lproj ends up in the bundle (which is also what makes the App Store list Danish).
  knownRegions: [en, da, Base]
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: KDWZ3WNLDK
    CODE_SIGN_STYLE: Automatic
packages:
  IAMJARLDesignTokens:
    url: https://github.com/JarlLyng/iamjarl-design
    from: 1.36.0
targets:
  Whiskerling:
    type: application
    platform: iOS
    sources:
      - path: Whiskerling
    dependencies:
      - package: IAMJARLDesignTokens
    info:
      path: Whiskerling/Info.plist
      properties:
        CFBundleDisplayName: Whiskerling
        NSHumanReadableCopyright: "© 2026 IAMJARL"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.kids-games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.whiskerling
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
  WhiskerlingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhiskerlingTests
      - path: Whiskerling.storekit
        buildPhase: resources
    dependencies:
      - target: Whiskerling
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.whiskerling.tests
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Whiskerling.app/Whiskerling"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Whiskerling:
    build:
      targets:
        Whiskerling: all
        WhiskerlingTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Whiskerling.storekit
    test:
      config: Debug
      targets:
        - WhiskerlingTests
